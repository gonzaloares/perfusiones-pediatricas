name: Verificar biblioteca documental (no clínica)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-seguridad:
    name: Integridad documental y cálculo matemático
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar verificaciones automáticas
        run: node --test tests/check-data.test.mjs
